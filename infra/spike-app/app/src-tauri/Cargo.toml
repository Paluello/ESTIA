[package]
name = "estia-spike-app"
version = "0.0.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"
description = "Spike S6: l'app ESTIA su Tauri 2 (ADR 0044)"

[lib]
name = "estia_spike_app_lib"
# staticlib per iOS, cdylib per Android, rlib per il binario desktop.
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
anyhow = "1"
estia-ponte = { path = "../../ponte" }
iroh = "=1.4.1"
keyring-core = "=1.0.1"
chacha20poly1305 = "0.10.1"

# La cassaforte del sistema, una per piattaforma (ADR 0044 §2).
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", features = ["keychain", "protected"] }

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "=1.0.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "=1.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "=1.0.1", features = ["crypto-rust"] }

[profile.release]
strip = true
