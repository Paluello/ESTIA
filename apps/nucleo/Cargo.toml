[package]
name = "estia-nucleo"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"
description = "Il nucleo comune delle app native di ESTIA (ADR 0051): MLS, e poi il filo verso la Casa"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "estia_nucleo"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["legami"]

[features]
# Il generatore dei legami Swift e Kotlin: serve a scripts/legami.sh, non a
# chi usa il nucleo come libreria (l'app del PC).
legami = ["uniffi/cli"]

[dependencies]
openmls = "=0.9.2"
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"
openmls_memory_storage = "=0.6.0"
openmls_traits = "=0.6.0"
# L'archivio (src/archivio.rs): le stesse primitive RustCrypto che OpenMLS usa
# già, MIT o Apache-2.0.
aes-gcm = "0.10"
base64 = "0.22"
getrandom = "0.2"
zeroize = "1"
thiserror = "2"
uniffi = { version = "0.29", features = ["tokio"] }
# Il filo verso la Casa, le stesse versioni di apps/app (ADR 0044).
iroh = "=1.4.1"
iroh-tickets = "=1.0.0"
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1

# iroh 1.4.1 non compila per iOS con libc >= 0.2.190: le stesse copie
# corrette che usa apps/app (vedi ../app/patches/README.md).
[patch.crates-io]
netdev = { path = "../app/patches/netdev" }
netwatch = { path = "../app/patches/netwatch" }

[workspace]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
