[package]
name = "estia-nucleo"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"
description = "Il nucleo comune delle app native di ESTIA (ADR 0051): MLS, e poi il filo verso la Casa"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "estia_nucleo"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
openmls = "=0.9.2"
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"
openmls_memory_storage = "=0.6.0"
openmls_traits = "=0.6.0"
thiserror = "2"
uniffi = { version = "0.29", features = ["cli"] }

[profile.release]
strip = true
lto = true
codegen-units = 1

[workspace]
